apiVersion: apps/v1
kind: Deployment
metadata:
  name: social
  labels:
    app.kubernetes.io/name: social
    app.kubernetes.io/instance: social
spec:
  replicas: 1
  strategy:
    type: Recreate   # single ReadWriteOnce PVC, avoid two pods mounting it at once during rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: social
      app.kubernetes.io/instance: social
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social
        app.kubernetes.io/instance: social
    spec:
      containers:
        - name: social
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresSecretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresSecretName }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresSecretName }}
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.infra.svc.cluster.local:5432/$(POSTGRES_DB)"
            - name: STORAGE_PATH
              value: "/data/files"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: social-data
